name: Check and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: App loads
        env:
          NODE_ENV: development
        run: node -e "require('./src/server').createApp(); console.log('ok'); process.exit(0)"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        id: creds
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "SSH secrets are not set yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull, build, migrate, restart
        if: steps.creds.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            source "${{ secrets.NODEVENV }}"
            cd ~/acm-sinai-website
            git pull --ff-only
            npm ci --omit=dev
            npm install --no-save tailwindcss@3
            npm run build:css
            npm run migrate -- --no-seed
            mkdir -p tmp && touch tmp/restart.txt
            sleep 3
            curl -fsS https://su.acm.org/healthz
